version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tesla
      POSTGRES_PASSWORD: teslapool
      POSTGRES_DB: dhaka_tesla
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://tesla:teslapool@postgres:5432/dhaka_tesla
      JWT_SECRET: super_secret_jwt_key_change_in_production
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
